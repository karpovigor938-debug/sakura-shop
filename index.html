<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKURA — Цветочный салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans pb-24">
    <div class="max-w-md mx-auto p-4">
        <header class="text-center my-6">
            <h1 class="text-2xl font-serif tracking-wide text-rose-800">SAKURA</h1>
            <p class="text-xs text-stone-500 uppercase tracking-widest">Цветочный салон</p>
        </header>

        <!-- Каталог -->
        <div id="catalog" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-stone-100 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-32 bg-rose-100 rounded-xl mb-2 flex items-center justify-center text-rose-400 font-serif text-lg">🌸</div>
                        <h3 class="font-medium text-sm">Букет «Нежность»</h3>
                        <p class="text-xs text-stone-500 mt-1">Пионовидные розы, эвкалипт</p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="font-semibold text-rose-700">3 500 ₽</span>
                        <button onclick="addToCart('Букет «Нежность»', 3500)" class="bg-rose-700 text-white text-xs px-3 py-1.5 rounded-full active:scale-95 transition">В корзину</button>
                    </div>
                </div>
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-stone-100 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-32 bg-red-100 rounded-xl mb-2 flex items-center justify-center text-red-400 font-serif text-lg">🌹</div>
                        <h3 class="font-medium text-sm">Красные розы (15 шт)</h3>
                        <p class="text-xs text-stone-500 mt-1">Элитные длинные розы</p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="font-semibold text-rose-700">4 200 ₽</span>
                        <button onclick="addToCart('Красные розы (15 шт)', 4200)" class="bg-rose-700 text-white text-xs px-3 py-1.5 rounded-full active:scale-95 transition">В корзину</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Корзина -->
        <div id="cart" class="mt-8 bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
            <h2 class="font-medium text-md mb-3 text-stone-700">Ваш заказ</h2>
            <div id="cart-items" class="text-sm text-stone-500 mb-4">Корзина пуста</div>
            <div class="border-t pt-3 flex justify-between font-semibold mb-4">
                <span>Итого:</span>
                <span id="total-price">0 ₽</span>
            </div>
            <button onclick="checkout()" class="w-full bg-stone-900 text-white py-3 rounded-xl font-medium text-sm active:scale-95 transition">Оформить заказ</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCart() {
            let container = document.getElementById('cart-items');
            let totalEl = document.getElementById('total-price');
            if (cart.length === 0) {
                container.innerHTML = 'Корзина пуста';
                totalEl.innerText = '0 ₽';
                return;
            }
            container.innerHTML = cart.map(item => `<div class="flex justify-between py-1"><span>${item.name}</span><span>${item.price} ₽</span></div>`).join('');
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.innerText = total + ' ₽';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста');
                return;
            }
            let orderSummary = cart.map(i => i.name).join(', ');
            tg.sendData(JSON.stringify({order: orderSummary, cart: cart}));
            tg.close();
        }
    </script>
</body>
</html>
